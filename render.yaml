services:
  - type: web
    name: strangerverse-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: pnpm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OWNER_EMAIL
        value: preethivejr@gmail.com
      # Optional Supabase environment variables
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_ROLE_KEY
      #   sync: false
