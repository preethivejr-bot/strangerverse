<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sv-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="sv-grad-inner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Orbit Rings -->
  <circle cx="50" cy="50" r="44" stroke="url(#sv-grad-primary)" stroke-width="2.5" stroke-dasharray="16 8 8 8" opacity="0.85" />
  <circle cx="50" cy="50" r="36" stroke="#8B5CF6" stroke-width="1.2" opacity="0.4" />
  
  <!-- Central Hex-Node -->
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" fill="url(#sv-grad-inner)" opacity="0.3" stroke="url(#sv-grad-primary)" stroke-width="2" filter="url(#glow)" />
  
  <!-- Dynamic S-Wave Core -->
  <path d="M38 32 C 48 24, 62 38, 50 50 C 38 62, 52 76, 62 68" stroke="#00F5FF" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#glow)" />
  
  <!-- Connected Nodes -->
  <circle cx="50" cy="22" r="3.5" fill="#00F5FF" />
  <circle cx="74" cy="36" r="3.5" fill="#EC4899" />
  <circle cx="74" cy="64" r="3.5" fill="#8B5CF6" />
  <circle cx="50" cy="78" r="3.5" fill="#00F5FF" />
  <circle cx="26" cy="64" r="3.5" fill="#3B82F6" />
  <circle cx="26" cy="36" r="3.5" fill="#8B5CF6" />
  <circle cx="50" cy="50" r="4" fill="#FFFFFF" filter="url(#glow)" />
</svg>
